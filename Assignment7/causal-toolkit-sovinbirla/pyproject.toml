[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-toolkit-sovinbirla"
version = "0.1.1"
description = "Causal inference tools for randomized trials, propensity scores, and meta-learners"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sovin Birla"}]
keywords = ["causal inference", "statistics", "treatment effects", "meta-learners"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2,<1.10",
    "lightgbm>=4.0",
    "patsy>=0.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "build>=1", "twine>=6"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=4", "build>=1", "twine>=6"]

[project.urls]
Homepage = "https://github.com/sovinbirla/causal-toolkit-sovinbirla"
Documentation = "https://github.com/sovinbirla/causal-toolkit-sovinbirla#readme"
Repository = "https://github.com/sovinbirla/causal-toolkit-sovinbirla"
"Bug Tracker" = "https://github.com/sovinbirla/causal-toolkit-sovinbirla/issues"

[tool.setuptools]
packages = ["causal_toolkit_sovinbirla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
